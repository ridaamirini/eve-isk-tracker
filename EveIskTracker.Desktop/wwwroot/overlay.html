<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>EVE ISK Tracker Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* PULSAR-Widget aus dem Design-Handoff: 420×240, Browser-Quelle in OBS/Streamlabs */
  :root{
    --bg:#0a0f16; --text:#e4ebf4; --accent:#4da3ff;
    --accent-200:#b6d8ff; --accent-800:#1c3d61;
    --n400:#99a4b5; --n700:#464f5e;
  }
  /* 420×240: Platz für bis zu zwei Kachelreihen. Bei nur einer Reihe bleibt der
     untere Bereich schlicht transparent. */
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:420px;height:240px}
  /* body positionieren, damit sich die Kachel an den 420×240 ausrichtet und nicht
     am Fenster — sonst verzerrt sie, sobald die Quelle nicht exakt passt */
  body{position:relative}
  #w{
    position:absolute;top:4px;left:4px;right:4px;
    border-radius:8px;border:1px solid var(--accent-800);
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    box-shadow:0 0 0 1px rgba(44,51,63,.6),0 16px 40px rgba(0,0,0,.65),0 0 24px color-mix(in srgb,var(--accent) 15%,transparent);
    font-family:'IBM Plex Sans',sans-serif;color:var(--text);
    opacity:0;transition:opacity .4s ease;
  }
  #w.on{opacity:1}
  .head{
    display:flex;align-items:center;gap:8px;padding:0 14px;height:30px;
    border-bottom:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .title{font-size:10px;letter-spacing:.16em;color:var(--accent-200)}
  .char{margin-left:auto;font-size:10px;color:var(--n400);display:flex;align-items:center;gap:6px}
  .char img{width:18px;height:18px;border-radius:50%;border:1px solid var(--accent-800)}
  /* Zellenbreite richtet sich nach der vollsten Reihe; kürzere Reihen werden
     zentriert — sonst blähen sich z.B. 2 Zellen unter 3en unschön auf */
  .row{display:flex;justify-content:center;padding:12px 6px 0}
  .cell{flex:0 0 auto;text-align:center}
  .label{font-size:9px;letter-spacing:.12em;color:var(--n400)}
  .value{font-family:'Chakra Petch',sans-serif;font-size:19px;color:var(--text);font-variant-numeric:tabular-nums}
  .value.accent{color:var(--accent-200)}
  .value.pos{color:#4dd398}
  .value.neg{color:#f2647a}
  .sep{width:1px;background:linear-gradient(180deg,transparent,var(--n700),transparent)}
  /* DPS-Graph (optionale "Kachel": Live-Kurven aus dem Combat-Log) */
  #dpswrap{display:none;padding:6px 12px 10px}
  .dpsbar{display:flex;justify-content:space-between;align-items:baseline;
          font-size:9px;letter-spacing:.12em;color:var(--n400);margin-bottom:3px}
  .dpsbar b{font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:600;
            color:var(--accent-200);font-variant-numeric:tabular-nums}
  .dpsbar .in b{color:#f2647a}
  #dpsCv{display:block;width:100%;height:62px}
</style>
</head>
<body>

<div id="w">
  <div class="head">
    <span class="dot"></span>
    <span class="title">ISK TRACKER · LIVE</span>
    <span class="char" id="char">–</span>
  </div>
  <div id="rows"></div>
  <div id="dpswrap">
    <div class="dpsbar">
      <span><span id="dpsOutL">ERTEILT</span> <b id="dpsOutV">0</b></span>
      <span class="in"><span id="dpsInL">ERLITTEN</span> <b id="dpsInV">0</b></span>
    </div>
    <canvas id="dpsCv"></canvas>
  </div>
</div>

<script>
const charId = new URLSearchParams(location.search).get('charId');
// demo=1: die App-Vorschau zeigt simulierte DPS-Kurven statt echter Log-Daten
const DEMO = new URLSearchParams(location.search).get('demo') === '1';

function fmt(v){
  const a = Math.abs(v);
  if (a >= 1e12) return (a/1e12).toFixed(2)+'T';
  if (a >= 1e9)  return (a/1e9).toFixed(2)+'B';
  if (a >= 1e6)  return (a/1e6).toFixed(1)+'M';
  if (a >= 1e3)  return (a/1e3).toFixed(1)+'K';
  return Math.round(a).toString();
}
const signed = v => (v < 0 ? '−' : '+') + fmt(v);

// Welche Kacheln es gibt; die Auswahl kommt vom Server (in der App umschaltbar).
// "CA." bei Bounties/Missionen: die Werte stammen aus dem Journal, das CCP bis zu
// eine Stunde cached — sie laufen der großen Session-Zahl also hinterher.
const clock = h => {
  const s = Math.max(0, Math.round(h * 3600));
  const p = n => String(n).padStart(2, '0');
  return `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
};
// Labels [deutsch, englisch] — die Sprache kommt vom Server mit (Settings der App)
const METRICS = {
  time:     { label: ['SESSION', 'SESSION'],             render: d => d.active ? { text: clock(d.hours), cls: '', timer: true } : { text: '–', cls: '' } },
  session:  { label: ['SESSION-ISK', 'SESSION ISK'],     render: d => d.active ? { text: signed(d.delta), cls: d.delta > 0 ? 'pos' : d.delta < 0 ? 'neg' : '' } : { text: '–', cls: '' } },
  rate:     { label: ['ISK/STUNDE', 'ISK/HOUR'],         render: d => d.active ? { text: signed(d.iskPerHour), cls: 'accent' } : { text: '–', cls: '' } },
  bounties: { label: ['BOUNTIES CA.', 'BOUNTIES EST.'],  render: d => d.active && d.bounties > 0 ? { text: fmt(d.bounties), cls: 'pos' } : { text: '–', cls: '' } },
  missions: { label: ['MISSIONEN CA.', 'MISSIONS EST.'], render: d => d.active && d.missions > 0 ? { text: fmt(d.missions), cls: 'pos' } : { text: '–', cls: '' } },
  kills:    { label: ['KILLS', 'KILLS'],                 render: d => d.active ? { text: String(d.kills || 0), cls: '' } : { text: '–', cls: '' } },
  destroyed:{ label: ['ZERSTÖRT', 'DESTROYED'],          render: d => d.active && d.destroyed > 0 ? { text: fmt(d.destroyed), cls: 'accent' } : { text: '–', cls: '' } },
  mining:   { label: ['MINING-WERT', 'MINING VALUE'],    render: d => d.active && d.mining > 0 ? { text: fmt(d.mining), cls: '' } : { text: '–', cls: '' } },
  wallet:   { label: ['WALLET', 'WALLET'],               render: d => ({ text: fmt(d.balance), cls: '' }) },
};
const langIx = d => d.lang === 'en' ? 1 : 0;

// Anzeige-Beruhigung für den Stream: Zahlen ändern sich nur, wenn CCP wirklich neue
// Daten geliefert hat (Kontostand/Mining), nicht bei jedem Abfrage-Tick. ISK/h enthält
// die laufende Zeit als Divisor und würde sonst ständig kriechen — sie wird höchstens
// alle 5 Minuten neu berechnet (und sofort bei Session-Start/-Stopp).
// Haltezeit kommt vom Server mit (in den Settings einstellbar), Standard 5 min
let rateHoldMs = 5 * 60 * 1000;
let sessionStartMs = null;   // für den lokal tickenden Timer
const last = { active: null, balance: null, delta: null, mining: null, bounties: null, missions: null,
               kills: null, destroyed: null,
               metrics: '', rate: { text: '–', cls: '' }, rateAt: 0 };

// Bis zu 4 Kacheln pro Reihe, ab 5 ausgewogen auf zwei Reihen verteilt
function chunkRows(list){
  if (list.length <= 4) return [list];
  const half = Math.ceil(list.length / 2);
  return [list.slice(0, half), list.slice(half)];
}

async function tick(){
  const w = document.getElementById('w');
  if (!charId){ w.classList.remove('on'); return; }
  try{
    const r = await fetch('/api/overlay-data?charId=' + encodeURIComponent(charId));
    if (!r.ok) throw 0;
    const d = await r.json();

    // "dps" ist keine Kachel, sondern der Graph unter den Reihen
    const keys = (d.metrics || []).filter(k => METRICS[k] || k === 'dps');
    const all = keys.length ? keys : Object.keys(METRICS);
    dpsOn = all.includes('dps');
    document.getElementById('dpswrap').style.display = dpsOn ? 'block' : 'none';
    const list = all.filter(k => k !== 'dps');
    const metricsKey = all.join(',');
    const now = Date.now();

    if (d.rateHold) rateHoldMs = d.rateHold * 1000;
    sessionStartMs = d.active ? now - d.hours * 3600000 : null;

    const activeChanged = d.active !== last.active;
    const dataChanged = d.balance !== last.balance || d.delta !== last.delta || d.mining !== last.mining
                     || d.bounties !== last.bounties || d.missions !== last.missions
                     || d.kills !== last.kills || d.destroyed !== last.destroyed;
    const layoutChanged = metricsKey !== last.metrics;
    const rateDue = activeChanged || (now - last.rateAt >= rateHoldMs);

    if (rateDue) { last.rate = METRICS.rate.render(d); last.rateAt = now; }

    const lx = langIx(d);
    const charChanged = d.showChar !== last.showChar;
    if (activeChanged || dataChanged || layoutChanged || rateDue || charChanged || lx !== last.lx) {
      last.lx = lx; last.showChar = d.showChar;
      // Kopfzeile: Portrait + Name, per Opsec-Schalter in der App abschaltbar
      document.getElementById('char').innerHTML = d.showChar
        ? `<img src="https://images.evetech.net/characters/${d.charId}/portrait?size=64" alt="" onerror="this.remove()">${(d.name || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}`
        : '';
      document.getElementById('dpsOutL').textContent = lx === 1 ? 'DEALT' : 'ERTEILT';
      document.getElementById('dpsInL').textContent = lx === 1 ? 'TAKEN' : 'ERLITTEN';
      const rows = list.length ? chunkRows(list) : [];
      const cellW = rows.length ? `width:calc(${(100 / rows[0].length).toFixed(3)}% - 1px)` : '';
      document.getElementById('rows').innerHTML = rows.map(row =>
        '<div class="row">' + row.map(k => {
          const v = k === 'rate' ? last.rate : METRICS[k].render(d);
          const id = v.timer ? ' id="tmr"' : '';
          return `<div class="cell" style="${cellW}"><div class="label">${METRICS[k].label[lx]}</div><div class="value ${v.cls}"${id}>${v.text}</div></div>`;
        }).join('<div class="sep"></div>') + '</div>').join('');
      last.active = d.active; last.balance = d.balance; last.delta = d.delta;
      last.mining = d.mining; last.bounties = d.bounties; last.missions = d.missions;
      last.kills = d.kills; last.destroyed = d.destroyed;
      last.metrics = metricsKey;
    }

    w.classList.add('on');
  } catch(e){
    // App nicht erreichbar: ausblenden statt Fehler im Stream zeigen
    w.classList.remove('on');
  }
}

// ---- DPS-Graph (optional): Live-Kurven aus dem Combat-Log, 1s-Takt ----
// Gepollt wird nur die lokale App; deren Log-Mitleser schläft automatisch ein,
// sobald das Widget (bzw. die Option) nicht mehr aktiv ist.
let dpsOn = false;
const DPS_WINDOW = 120, DPS_SMOOTH = 10;

// EVE schreibt sein Log gepuffert — die jüngsten Sekunden füllen sich nachträglich.
// Deshalb bleiben die letzten DPS_EDGE Sekunden unsichtbar, bis sie stabil sind;
// sonst "zuckt" die Kurve am rechten Rand.
const DPS_EDGE = 3, DPS_SMOOTHW = 7;
let dpsSeries = null;   // letzter Datenstand + Zeitstempel fürs flüssige Scrollen

async function dpsTick(){
  if (!dpsOn || !charId) return;
  let d;
  try {
    const r = await fetch(`/api/dps?charId=${encodeURIComponent(charId)}&window=${DPS_WINDOW + DPS_SMOOTH + DPS_SMOOTHW + DPS_EDGE + 1}${DEMO ? '&demo=1' : ''}`);
    if (!r.ok) return;
    d = await r.json();
  } catch(e){ return; }

  // angebrochene Sekunde + Nachzügler-Puffer abschneiden
  const cut = a => a.slice(0, -(DPS_EDGE + 1));
  const dealt = cut(d.dealt), taken = cut(d.taken);
  const avg = a => a.slice(-DPS_SMOOTH).reduce((x, y) => x + y, 0) / DPS_SMOOTH;
  document.getElementById('dpsOutV').textContent = fmt(avg(dealt));
  document.getElementById('dpsInV').textContent = fmt(avg(taken));
  // erst glätten, dann aufs Fenster schneiden — so hat auch der linke Rand volle Glättung
  dpsSeries = {
    dealt: smoothArr(dealt).slice(-DPS_WINDOW),
    taken: smoothArr(taken).slice(-DPS_WINDOW),
    at: performance.now(),
  };
}

// Gleitender Mittelwert (nur Vergangenheit): macht aus Sekundennadeln runde Hügel
function smoothArr(arr, w = DPS_SMOOTHW){
  const out = new Array(arr.length);
  for (let i = 0; i < arr.length; i++){
    let s = 0, n = 0;
    for (let j = Math.max(0, i - w + 1); j <= i; j++){ s += arr[j]; n++; }
    out[i] = s / n;
  }
  return out;
}

// Flüssig statt sekündlich: die Kurve gleitet per Animationsframe kontinuierlich
// nach links, der Versatz kommt aus der Zeit seit dem letzten Datenstand
function drawDps(){
  const s = dpsSeries;
  const cv = document.getElementById('dpsCv');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !s) return;
  if (cv.width !== W * dpr || cv.height !== H * dpr){ cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const max = Math.max(10, ...s.dealt, ...s.taken);
  const top = 2, bottom = H - 2;
  const px = W / (DPS_WINDOW - 1);
  const shift = Math.min((performance.now() - s.at) / 1000, 2);
  const X = i => W - ((s.dealt.length - 1 - i) + shift) * px;
  const Y = v => top + (1 - v / max) * (bottom - top);

  g.strokeStyle = 'rgba(70,79,94,.5)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, Y(max / 2)); g.lineTo(W, Y(max / 2)); g.stroke();

  // Weiche Kurve: Bézier durch die Mittelpunkte statt eckiger Linienzug
  const line = (arr, color, fill) => {
    g.beginPath();
    g.moveTo(X(0), Y(arr[0]));
    for (let i = 1; i < arr.length - 1; i++)
      g.quadraticCurveTo(X(i), Y(arr[i]), (X(i) + X(i + 1)) / 2, (Y(arr[i]) + Y(arr[i + 1])) / 2);
    g.lineTo(X(arr.length - 1), Y(arr[arr.length - 1]));
    g.strokeStyle = color; g.lineWidth = 1.5; g.stroke();
    g.lineTo(X(arr.length - 1), bottom); g.lineTo(X(0), bottom); g.closePath();
    g.fillStyle = fill; g.fill();
  };
  line(s.taken, 'rgba(242,100,122,.95)', 'rgba(242,100,122,.10)');
  line(s.dealt, 'rgba(77,163,255,.95)', 'rgba(77,163,255,.12)');
}
setInterval(dpsTick, 1000);
(function dpsFrame(){
  if (dpsOn && dpsSeries) drawDps();
  requestAnimationFrame(dpsFrame);
})();

// Der Timer tickt lokal jede Sekunde — das einzige bewusst "lebendige" Element
setInterval(() => {
  const el = document.getElementById('tmr');
  if (el && sessionStartMs !== null)
    el.textContent = clock((Date.now() - sessionStartMs) / 3600000);
}, 1000);

tick();
// 5s: fragt nur die lokale App, kein Verkehr zu CCP — neue Werte erscheinen
// damit binnen Sekunden, sobald der Sync sie hat
setInterval(tick, 5000);
</script>
</body>
</html>
