<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>EVE ISK Tracker Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* PULSAR-Widget aus dem Design-Handoff: 420×128, Browser-Quelle in OBS/Streamlabs */
  :root{
    --bg:#0a0f16; --text:#e4ebf4; --accent:#4da3ff;
    --accent-200:#b6d8ff; --accent-800:#1c3d61;
    --n400:#99a4b5; --n700:#464f5e;
  }
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:420px;height:128px}
  /* body positionieren, damit sich die Kachel an den 420×128 ausrichtet und nicht
     am Fenster — sonst verzerrt sie, sobald die Quelle nicht exakt passt */
  body{position:relative}
  #w{
    position:absolute;inset:4px;
    border-radius:8px;border:1px solid var(--accent-800);
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    box-shadow:0 0 0 1px rgba(44,51,63,.6),0 16px 40px rgba(0,0,0,.65),0 0 24px color-mix(in srgb,var(--accent) 15%,transparent);
    font-family:'IBM Plex Sans',sans-serif;color:var(--text);
    opacity:0;transition:opacity .4s ease;
  }
  #w.on{opacity:1}
  .head{
    display:flex;align-items:center;gap:8px;padding:0 14px;height:30px;
    border-bottom:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .title{font-size:10px;letter-spacing:.16em;color:var(--accent-200)}
  .char{margin-left:auto;font-size:10px;color:var(--n400)}
  .row{display:flex;padding:12px 6px 0}
  .cell{flex:1;text-align:center}
  .label{font-size:9px;letter-spacing:.12em;color:var(--n400)}
  .value{font-family:'Chakra Petch',sans-serif;font-size:19px;color:var(--text);font-variant-numeric:tabular-nums}
  .value.accent{color:var(--accent-200)}
  .value.pos{color:#4dd398}
  .value.neg{color:#f2647a}
  .sep{width:1px;background:linear-gradient(180deg,transparent,var(--n700),transparent)}
</style>
</head>
<body>

<div id="w">
  <div class="head">
    <span class="dot"></span>
    <span class="title">ISK TRACKER · LIVE</span>
    <span class="char" id="char">–</span>
  </div>
  <div class="row" id="row"></div>
</div>

<script>
const charId = new URLSearchParams(location.search).get('charId');

function fmt(v){
  const a = Math.abs(v);
  if (a >= 1e12) return (a/1e12).toFixed(2)+'T';
  if (a >= 1e9)  return (a/1e9).toFixed(2)+'B';
  if (a >= 1e6)  return (a/1e6).toFixed(1)+'M';
  if (a >= 1e3)  return (a/1e3).toFixed(1)+'K';
  return Math.round(a).toString();
}
const signed = v => (v < 0 ? '−' : '+') + fmt(v);

// Welche Kacheln es gibt; die Auswahl kommt vom Server (in der App umschaltbar)
const METRICS = {
  wallet:  { label: 'WALLET',  render: d => ({ text: fmt(d.balance), cls: '' }) },
  rate:    { label: 'ISK/H',   render: d => d.active ? { text: signed(d.iskPerHour), cls: 'accent' } : { text: '–', cls: '' } },
  session: { label: 'SESSION', render: d => d.active ? { text: signed(d.delta), cls: d.delta > 0 ? 'pos' : d.delta < 0 ? 'neg' : '' } : { text: '–', cls: '' } },
  mining:  { label: 'MINING',  render: d => d.active && d.mining > 0 ? { text: fmt(d.mining), cls: '' } : { text: '–', cls: '' } },
};

async function tick(){
  const w = document.getElementById('w');
  if (!charId){ w.classList.remove('on'); return; }
  try{
    const r = await fetch('/api/overlay-data?charId=' + encodeURIComponent(charId));
    if (!r.ok) throw 0;
    const d = await r.json();

    document.getElementById('char').textContent = d.name || '';

    const keys = (d.metrics || []).filter(k => METRICS[k]);
    const list = keys.length ? keys : Object.keys(METRICS);
    document.getElementById('row').innerHTML = list.map(k => {
      const v = METRICS[k].render(d);
      return `<div class="cell"><div class="label">${METRICS[k].label}</div><div class="value ${v.cls}">${v.text}</div></div>`;
    }).join('<div class="sep"></div>');

    w.classList.add('on');
  } catch(e){
    // App nicht erreichbar: ausblenden statt Fehler im Stream zeigen
    w.classList.remove('on');
  }
}

tick();
// 5s: fragt nur die lokale App, kein Verkehr zu CCP — neue Werte erscheinen
// damit binnen Sekunden, sobald der Sync sie hat
setInterval(tick, 5000);
</script>
</body>
</html>
