<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>EVE ISK Tracker — DPS-Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Eigenständiger DPS-Graph als Browser-Quelle (420×150), frei platzierbar —
     dieselben Kurven wie im Game-Overlay, im Stil des Stream-Widgets. */
  :root{
    --bg:#0a0f16; --text:#e4ebf4; --accent:#4da3ff;
    --accent-200:#b6d8ff; --accent-800:#1c3d61;
    --n400:#99a4b5; --n700:#464f5e; --red:#f2647a;
  }
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:420px;height:150px}
  body{position:relative;font-family:'IBM Plex Sans',sans-serif;color:var(--text)}
  #w{
    position:absolute;top:4px;left:4px;right:4px;
    border-radius:8px;border:1px solid var(--accent-800);
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    box-shadow:0 0 0 1px rgba(44,51,63,.6),0 16px 40px rgba(0,0,0,.65),0 0 24px color-mix(in srgb,var(--accent) 15%,transparent);
    opacity:0;transition:opacity .4s ease;
  }
  #w.on{opacity:1}
  .head{
    display:flex;align-items:center;gap:8px;padding:0 12px;height:24px;
    border-bottom:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .title{font-size:10px;letter-spacing:.16em;color:var(--accent-200)}
  .char{margin-left:auto;font-size:10px;color:var(--n400)}
  .body{padding:6px 12px 10px}
  .bar{display:flex;justify-content:space-between;align-items:baseline;
       font-size:9px;letter-spacing:.12em;color:var(--n400);margin-bottom:3px}
  .bar b{font-family:'Chakra Petch',sans-serif;font-size:14px;font-weight:600;
         color:var(--accent-200);font-variant-numeric:tabular-nums}
  .bar .in b{color:var(--red)}
  canvas{display:block;width:100%;height:72px}
</style>
</head>
<body>

<div id="w">
  <div class="head">
    <span class="dot"></span>
    <span class="title">COMBAT · LIVE</span>
    <span class="char" id="char"></span>
  </div>
  <div class="body">
    <div class="bar">
      <span><span id="outL">ERTEILT</span> <b id="outV">0</b><span style="font-size:9px;color:var(--n400)"> DPS</span></span>
      <span class="in"><span id="inL">ERLITTEN</span> <b id="inV">0</b><span style="font-size:9px;color:var(--n400)"> DPS</span></span>
    </div>
    <canvas id="cv"></canvas>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const WINDOW = 120, SMOOTH = 10, SMOOTHW = 7, EDGE = 3;
let series = null;   // letzter Datenstand + Zeitstempel fürs flüssige Scrollen
const params = new URLSearchParams(location.search);
// Standard: folgt dem in der App gewählten Charakter; pin=1 bindet fest an die charId
const PIN = params.get('pin') === '1' ? params.get('charId') : null;
const qChar = PIN ? 'charId=' + encodeURIComponent(PIN) + '&' : '';
// demo=1: simulierte Kurven (Vorschau/Test ohne laufenden Kampf)
const DEMO = params.get('demo') === '1';

function fmt(v){
  const a = Math.abs(v);
  if (a >= 1e6) return (a/1e6).toFixed(1)+'M';
  if (a >= 1e3) return (a/1e3).toFixed(1)+'K';
  return Math.round(a).toString();
}

async function tick(){
  const w = $('w');
  let d;
  try {
    const r = await fetch(`/api/dps?${qChar}window=${WINDOW + SMOOTH + SMOOTHW + EDGE + 1}${DEMO ? '&demo=1' : ''}`);
    if (!r.ok) throw 0;
    d = await r.json();
  } catch(e){
    // App nicht erreichbar: ausblenden statt Fehler im Stream zeigen
    w.classList.remove('on');
    return;
  }

  const en = (d.lang || 'de') === 'en';
  $('outL').textContent = en ? 'DEALT' : 'ERTEILT';
  $('inL').textContent = en ? 'TAKEN' : 'ERLITTEN';
  $('char').textContent = d.listener || '';

  // angebrochene Sekunde + Nachzügler-Puffer abschneiden: EVE schreibt sein Log
  // gepuffert, die jüngsten Sekunden füllen sich nachträglich und würden am
  // rechten Rand "zucken"
  const cut = a => a.slice(0, -(EDGE + 1));
  const dealt = cut(d.dealt), taken = cut(d.taken);
  const avg = a => a.slice(-SMOOTH).reduce((x, y) => x + y, 0) / SMOOTH;
  $('outV').textContent = fmt(avg(dealt));
  $('inV').textContent = fmt(avg(taken));
  // erst glätten, dann aufs Fenster schneiden — voller Mittelwert auch am linken Rand
  series = {
    dealt: smoothArr(dealt).slice(-WINDOW),
    taken: smoothArr(taken).slice(-WINDOW),
    at: performance.now(),
  };
  w.classList.add('on');
}

// Gleitender Mittelwert (nur Vergangenheit): macht aus Sekundennadeln runde Hügel
function smoothArr(arr, w = SMOOTHW){
  const out = new Array(arr.length);
  for (let i = 0; i < arr.length; i++){
    let s = 0, n = 0;
    for (let j = Math.max(0, i - w + 1); j <= i; j++){ s += arr[j]; n++; }
    out[i] = s / n;
  }
  return out;
}

// Flüssig statt sekündlich: die Kurve gleitet per Animationsframe kontinuierlich
// nach links, der Versatz kommt aus der Zeit seit dem letzten Datenstand
function draw(){
  const s = series;
  const cv = $('cv');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !s) return;
  if (cv.width !== W * dpr || cv.height !== H * dpr){ cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const max = Math.max(10, ...s.dealt, ...s.taken);
  const top = 2, bottom = H - 2;
  const px = W / (WINDOW - 1);
  const shift = Math.min((performance.now() - s.at) / 1000, 2);
  const X = i => W - ((s.dealt.length - 1 - i) + shift) * px;
  const Y = v => top + (1 - v / max) * (bottom - top);

  g.strokeStyle = 'rgba(70,79,94,.5)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, Y(max / 2)); g.lineTo(W, Y(max / 2)); g.stroke();
  g.fillStyle = 'rgba(153,164,181,.8)'; g.font = '9px IBM Plex Sans, sans-serif';
  g.fillText(fmt(max), 3, 10);

  // Weiche Kurve: Bézier durch die Mittelpunkte statt eckiger Linienzug
  const line = (arr, color, fill) => {
    g.beginPath();
    g.moveTo(X(0), Y(arr[0]));
    for (let i = 1; i < arr.length - 1; i++)
      g.quadraticCurveTo(X(i), Y(arr[i]), (X(i) + X(i + 1)) / 2, (Y(arr[i]) + Y(arr[i + 1])) / 2);
    g.lineTo(X(arr.length - 1), Y(arr[arr.length - 1]));
    g.strokeStyle = color; g.lineWidth = 1.6; g.stroke();
    g.lineTo(X(arr.length - 1), bottom); g.lineTo(X(0), bottom); g.closePath();
    g.fillStyle = fill; g.fill();
  };
  line(s.taken, 'rgba(242,100,122,.95)', 'rgba(242,100,122,.10)');
  line(s.dealt, 'rgba(77,163,255,.95)', 'rgba(77,163,255,.12)');
}

tick();
setInterval(tick, 1000);   // nur die lokale App, kein Verkehr nach außen
(function frame(){
  if (series) draw();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
